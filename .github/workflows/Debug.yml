name: Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.4.1"
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - name: Check out feature branch source
        uses: actions/checkout@v4
        with:
          ref: feature/jade-harbor-3d-controls

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          use-dotnet: false
          include-templates: true

      - name: Install Android command-line tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl --fail --location --retry 3 --output /tmp/android-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/android-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android platform packages
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager closes the input pipe after license acceptance; allowing that
          # expected SIGPIPE prevents `yes` from failing this step under pipefail.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create debug keystore and configure Godot Android paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          EOF

      - name: Export Godot project pack
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          godot --version
          godot --headless --path . --export-pack "Android Debug APK" build/nexacity.pck
          test -s build/nexacity.pck

      - name: Assemble and sign debug APK from official Godot template
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATE_ARCHIVE="/tmp/godot-export-templates.tpz"
          TEMPLATE_DIR="/tmp/godot-export-templates"
          WORK_DIR="build/apk_assets"
          UNSIGNED="build/nexacity-unsigned.apk"
          ALIGNED="build/nexacity-aligned.apk"
          APK="build/nexacity-debug.apk"
          curl --fail --location --retry 3 --output "$TEMPLATE_ARCHIVE" \
            https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz
          rm -rf "$TEMPLATE_DIR" "$WORK_DIR" "$UNSIGNED" "$ALIGNED" "$APK"
          mkdir -p "$TEMPLATE_DIR" "$WORK_DIR/assets"
          unzip -q "$TEMPLATE_ARCHIVE" -d "$TEMPLATE_DIR"
          TEMPLATE_APK="$(find "$TEMPLATE_DIR" -type f -name android_debug.apk -print -quit)"
          test -n "$TEMPLATE_APK"
          cp build/nexacity.pck "$WORK_DIR/assets/data.pck"
          python3 tools/write_command_line.py "$WORK_DIR/assets/_cl_" \
            --main-pack assets://data.pck \
            --xr_mode_regular \
            --xr-mode off \
            --fullscreen
          cp "$TEMPLATE_APK" "$UNSIGNED"
          (
            cd "$WORK_DIR"
            zip -q -r "../../$UNSIGNED" assets
          )
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          test -s build/nexacity-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexacity-debug-apk
          path: build/nexacity-debug.apk
          if-no-files-found: error
          retention-days: 14
